name: Source Topics

on:
  schedule:
    # Runs every 20 minutes, all day, every day - no fixed "check time"
    - cron: "*/20 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: source-topics-state
  cancel-in-progress: false # queue overlapping runs instead of racing/cancelling each other

jobs:
  source-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run topic sourcing
        run: npm run source-topics

      - name: Commit updated state
        run: |
          git config user.name "ardhi-ai-bot"
          git config user.email "actions@github.com"
          git add state/pending-topics.json state/seen-topics.json
          git diff --staged --quiet && echo "No new topics, nothing to commit" && exit 0
          git commit -m "chore: source topics $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "All push attempts failed" && exit 1
